# Docker 环境配置文件

# 数据库配置 - 使用环境变量
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:online_video}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis 配置 - 使用环境变量
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# 服务器配置 - 绑定所有网络接口
server.address=0.0.0.0
server.port=8080

# 文件存储配置 - 使用环境变量
spring.web.resources.static-locations=file:${STORAGE_PATH:/app/storage}/
video.upload-dir=${VIDEO_UPLOAD_DIR:/app/storage/videos}
image.upload-dir=${IMAGE_UPLOAD_DIR:/app/storage/images}

# JWT 配置
jwt.secret=${JWT_SECRET:aVeryLongAndSecureSecretKeyThatIsAtLeast64CharactersLong1234567890abcdefghijklmnopqrstuvwxyz}
jwt.expiration=${JWT_EXPIRATION:86400000}

# 邮件配置
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-handlers-package=com.example.onlinevideo.TypeHandler

# Swagger 配置
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# 日志配置 - 生产环境降低日志级别
logging.level.com.example.onlinevideo.Mapper=INFO
logging.level.org.apache.ibatis=WARN
